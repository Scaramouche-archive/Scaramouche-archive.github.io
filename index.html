<!DOCTYPE html>
<html>
<body>

<h1>TEST</h1>

<div id="output"></div>

<script>
fetch("wandererDB.json")
.then(r => r.json())
.then(data => {

    document.getElementById("output").innerHTML =
        "<pre>" +
        JSON.stringify(data, null, 2)
        + "</pre>";

})
.catch(err => {

    document.getElementById("output").innerHTML =
        "<h2>ERROR</h2><pre>" +
        err +
        "</pre>";

    console.error(err);
});
</script>

</body>
</html>
