<!DOCTYPE html>
<html>
<body>

<div id="out"></div>

<script>
fetch("wandererDB.json")
.then(r => r.text())
.then(text => {

    document.getElementById("out").textContent =
        text.substring(0, 500);

    console.log("JSON取得成功");

})
.catch(err => {

    document.body.innerHTML =
        "<pre>" + err + "</pre>";

    console.error(err);

});
</script>

</body>
</html>
