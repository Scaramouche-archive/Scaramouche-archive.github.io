<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wanderer Archive</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#111;
    color:#fff;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.card{
    background:#1a1a1a;
    border:1px solid #333;
    border-radius:12px;
    margin-bottom:30px;
    overflow:hidden;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    background:#222;
}

.tabs button{
    border:none;
    background:#222;
    color:white;
    padding:12px 16px;
    cursor:pointer;
    transition:.2s;
}

.tabs button:hover{
    background:#333;
}

.tabs button.active{
    background:#4a90e2;
}

.content{
    padding:20px;
}

.title{
    font-size:1.6rem;
    font-weight:bold;
    margin-bottom:16px;
}

.images{
    margin-top:20px;
}

.images img{
    display:block;
    max-width:100%;
    border-radius:8px;
    margin-bottom:12px;
}

.links{
    margin-top:20px;
}

.links a{
    display:inline-block;
    color:#7eb8ff;
    margin-right:12px;
    margin-bottom:8px;
    text-decoration:none;
}

.links a:hover{
    text-decoration:underline;
}

.error{
    color:#ff8080;
}
</style>
</head>
<body>

<h1>Wanderer Archive</h1>

<div id="app">Loading...</div>

<script>

const params = new URLSearchParams(window.location.search);
const defaultLang = params.get("lang");

fetch("./wandererDB.json")
.then(response => response.json())
.then(data => {

    const app = document.getElementById("app");
    app.innerHTML = "";

    Object.entries(data.intro).forEach(([id,item]) => {

        const card = document.createElement("div");
        card.className = "card";

        const tabs = document.createElement("div");
        tabs.className = "tabs";

        const content = document.createElement("div");
        content.className = "content";

        const availableLangs =
            Object.keys(data.language)
            .filter(lang =>
                item.description &&
                item.description[lang] !== null
            );

        if(availableLangs.length === 0){
            return;
        }

        function render(lang){

            content.innerHTML = "";

            const title = document.createElement("div");
            title.className = "title";
            title.textContent =
                item.title?.[lang]
                ?? item.title?.ja
                ?? "";

            content.appendChild(title);

            const description =
                document.createElement("div");

            description.innerHTML =
                item.description?.[lang]
                ?? "";

            content.appendChild(description);

            const imageArea =
                document.createElement("div");

            imageArea.className = "images";

            if(Array.isArray(item.img)){

                item.img.forEach(group => {

                    Object.values(group)
                    .forEach(imageSet => {

                        const path =
                            imageSet?.[lang];

                        if(!path){
                            return;
                        }

                        const img =
                            document.createElement("img");

                        img.src =
                            "img/" +
                            path +
                            ".jpg";

                        img.loading = "lazy";

                        img.onerror = () => {
                            img.remove();
                        };

                        imageArea.appendChild(img);

                    });

                });

            }

            content.appendChild(imageArea);

            const links =
                document.createElement("div");

            links.className = "links";

            if(
                Array.isArray(item.url)
                && item.url[0]
                && item.url[0][lang]
            ){

                item.url[0][lang]
                .forEach(site => {

                    Object.entries(site)
                    .forEach(([name,url]) => {

                        const a =
                            document.createElement("a");

                        a.href = url;
                        a.target = "_blank";
                        a.rel =
                            "noopener noreferrer";

                        a.textContent = name;

                        links.appendChild(a);

                    });

                });

            }

            content.appendChild(links);

            tabs
                .querySelectorAll("button")
                .forEach(btn =>
                    btn.classList.remove("active")
                );

            document
                .getElementById(
                    `tab-${id}-${lang}`
                )
                ?.classList.add("active");
        }

        availableLangs.forEach(lang => {

            const button =
                document.createElement("button");

            button.id =
                `tab-${id}-${lang}`;

            button.textContent =
                data.language[lang];

            button.addEventListener(
                "click",
                () => render(lang)
            );

            tabs.appendChild(button);

        });

        const initialLang =
            defaultLang &&
            availableLangs.includes(defaultLang)
                ? defaultLang
                : availableLangs[0];

        render(initialLang);

        card.appendChild(tabs);
        card.appendChild(content);

        app.appendChild(card);

    });

})
.catch(error => {

    document.getElementById("app").innerHTML =
        `<div class="error">
            ${error}
        </div>`;

    console.error(error);

});
</script>

</body>
</html>
