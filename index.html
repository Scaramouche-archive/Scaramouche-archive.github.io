<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wanderer Archive</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#111;
    color:#fff;
}

.card{
    border:1px solid #333;
    border-radius:10px;
    margin-bottom:20px;
    overflow:hidden;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    background:#222;
}

.tabs button{
    border:none;
    background:#222;
    color:white;
    padding:12px 16px;
    cursor:pointer;
}

.tabs button.active{
    background:#4a90e2;
}

.content{
    padding:20px;
}

.title{
    font-size:1.5rem;
    margin-bottom:16px;
}
</style>
</head>
<body>

<h1>Wanderer Archive</h1>

<div id="container"></div>

<script>
fetch("./wandererDB.json")
.then(response => {

    console.log(response);
    console.log(response.status);
    console.log(response.headers.get("content-type"));

    return response.text();

})
.then(text => {

    console.log(text.substring(0,100));

    document.body.innerHTML =
        "<pre>" +
        text.substring(0,500) +
        "</pre>";

})
.catch(console.error);
</script>

</body>
</html>
