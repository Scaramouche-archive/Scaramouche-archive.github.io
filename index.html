<script>
fetch("wandererDB.json")
.then(r => r.text())
.then(text => {

    console.log(text);

    try {
        const data = JSON.parse(text);

        document.body.innerHTML =
            "<h1>JSON OK</h1>";

        console.log(data);

    } catch(e) {

        document.body.innerHTML =
            "<pre>" + e.message + "</pre>";

        console.error(e);

    }

});
</script>
