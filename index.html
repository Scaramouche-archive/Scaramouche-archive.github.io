<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Wanderer Archive</title>
</head>
<body>

<div id="app"></div>

<script>

fetch("./wandererDB.json")
.then(r => r.json())
.then(data => {

    const app =
        document.getElementById("app");

    Object.values(data.intro)
    .forEach(item => {

        const article =
            document.createElement("article");

        article.innerHTML = `
            <h2>${item.title.ja}</h2>
            <div>${item.description.ja}</div>
            <hr>
        `;

        app.appendChild(article);

    });

});

</script>

</body>
</html>
